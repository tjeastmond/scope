name: Live Jev smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-jev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run Scope against the webhook-service fixture
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          node dist/cli.js "Add retry handling to Stripe webhook processing" \
            --repo fixtures/webhook-service --format json > "$RUNNER_TEMP/scope-live.json"
          test -s "$RUNNER_TEMP/scope-live.json"
