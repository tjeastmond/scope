name: Task
description: A planned piece of work (feature, tooling, docs, tests)
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The outcome this issue delivers.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Milestone (M1–M7), plan section, relevant paths.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist someone else can verify.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: "Depends on: #N"
